name: Auto Build Docker Image
on:
  push:
    branches:
      - "main"
      - "releases/**"
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Trust registry CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ secrets.DOCKER_REGISTRY }}
          echo "${{ secrets.REGISTRY_CA_CERT }}" | \
            sudo tee /etc/docker/certs.d/${{ secrets.DOCKER_REGISTRY }}/ca.crt > /dev/null

      - name: Verify CA trust
        run: |
          curl -u ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_PASSWORD }} https://${{ secrets.DOCKER_REGISTRY }}/v2/ 2&>1 | head -50

      - name: Docker Login to Private Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
